name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same ref when new commits are pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Build · Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # pnpm 11 requires Node >= 22.13 (node:sqlite)
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint
        continue-on-error: true # lint is advisory until fully wired across packages

      - name: Build
        run: pnpm build

      # Note: no separate migration step — the server self-migrates at startup
      # and the db package tests apply the real migrations to a fresh SQLite
      # file (see packages/db/test/migrate.test.ts).
      - name: Test
        run: pnpm test

  docker-image:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Verifies the release workflow's Dockerfile compiles; no push happens here.
      - name: Build the image
        run: docker build -t ninedeploy:ci .

  integration:
    name: Integration tests (real Docker + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # pnpm 11 requires Node >= 22.13 (node:sqlite)
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # Runs the testcontainers suite (real PostgreSQL container): exercises
      # the REAL backup/restore path end-to-end — arg-array docker exec,
      # docker cp, and the at-rest backup encryption round-trip.
      - name: Run integration tests
        run: pnpm --filter @ninedeploy/server exec vitest run test/integration --no-coverage
        env:
          RUN_INTEGRATION: '1'
