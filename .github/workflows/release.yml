name: Release

# Builds and publishes a Docker image when a version tag is pushed.

on:
  push:
    tags:
      - 'v*'

# L-14: least privilege at the workflow level; `packages: write` is granted
# only to the job that actually pushes the image.
permissions:
  contents: read

jobs:
  publish-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        # Derived from "packageManager" in package.json — see ci.yml.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A tag is a release artifact — never push an image that does not pass
      # the same verification gates CI enforces on every commit.
      - name: Release checks (typecheck · lint · build · test)
        run: pnpm release:check

      - name: Derive image tags
        if: success()
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # The `v` prefix matches the git tag convention
            # (`v0.4.0`, not `0.4.0`) so `docker pull
            # ghcr.io/ninedeploy/ninedeploy:v0.4.0` resolves
            # instead of 404'ing. Without the prefix the
            # action strips it and only `0.4.0` / `0.4` / `0` /
            # `latest` are produced.
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest

      - name: Log in to GHCR
        if: success()
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Disable GHCR's "Immutable tags" toggle on the package
      # so subsequent releases can overwrite the existing
      # `:0.4.0` / `:0.4` / `:0` / `:latest` tag slugs with
      # the new build instead of leaving the old digest
      # dangling alongside `:v0.4.0`. The PATCH is idempotent —
      # once the toggle is off it stays off, and the call is
      # a no-op on subsequent runs.
      - name: Allow GHCR tag overrides
        if: success()
        run: |
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            /orgs/${{ github.repository_owner }}/packages/container/ninedeploy \
            -f immutable_tags=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: success()
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Create the GitHub Release for this tag. Without this
      # step the tag exists in git but the Releases page stays
      # empty — every `git describe`, GitHub download URL, or
      # Releases-page visitor lands on a "No release notes"
      # dead-end. We pull the body from CHANGELOG.md (the
      # `## [0.4.0] - …` section) and pin the `v0.4.0` image
      # as the canonical download, so the page mirrors what
      # the project actually ships.
      - name: Publish GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for the full release notes.

            **Pull the image:**
            ```
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            docker pull ghcr.io/${{ github.repository }}:latest
            ```
          files: |
            CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
