packages:
  - "apps/*"
  - "packages/*"

# Force js-yaml >= 4.3.1 (CVE-2026-59870 / GHSA-5p4m-2wfm-xmqj): pm2 pins the
# vulnerable 4.3.0 exactly. ^4.3.1 resolves to 4.3.1 — the minimal patched
# version — without silently jumping pm2's dependency to the 5.x major.
overrides:
  js-yaml: "^4.3.1"
  # esbuild <=0.24.2 (GHSA-67mh-4wv8-2f99) arrives via the deprecated
  # @esbuild-kit toolchain under drizzle-kit (0.18.20). Pin the exact patched
  # version drizzle-kit already uses (0.25.12) — not a bare >= range, which
  # would let the deprecated toolchain ride a newer major than drizzle-kit's own.
  esbuild: "0.25.12"

# Dependencies allowed to run install scripts (pnpm 11 blocks these by default).
# esbuild ships its native binary via postinstall; Vite/tsx need it.
allowBuilds:
  cpu-features: true
  esbuild: true
  protobufjs: true
  ssh2: true

minimumReleaseAgeExclude:
  - '@node-rs/argon2-android-arm-eabi@2.1.0'
  - '@node-rs/argon2-android-arm64@2.1.0'
  - '@node-rs/argon2-darwin-arm64@2.1.0'
  - '@node-rs/argon2-darwin-x64@2.1.0'
  - '@node-rs/argon2-freebsd-x64@2.1.0'
  - '@node-rs/argon2-linux-arm-gnueabihf@2.1.0'
  - '@node-rs/argon2-linux-arm64-gnu@2.1.0'
  - '@node-rs/argon2-linux-arm64-musl@2.1.0'
  - '@node-rs/argon2-linux-x64-gnu@2.1.0'
  - '@node-rs/argon2-linux-x64-musl@2.1.0'
  - '@node-rs/argon2-win32-arm64-msvc@2.1.0'
  - '@node-rs/argon2-win32-ia32-msvc@2.1.0'
  - '@node-rs/argon2-win32-x64-msvc@2.1.0'
  - '@node-rs/argon2@2.1.0'

patchedDependencies:
  # glob@10.5.0 is deprecated (isaacs: "contain widely publicized security
  # vulnerabilities, fixed in the current version") and arrives via
  # testcontainers → archiver@7.0.1 → archiver-utils@5.0.2, which pins glob ^10.
  # archiver@8.0.0 would drop the chain but is ESM-only while testcontainers is
  # CJS (ERR_REQUIRE_ESM). Patch archiver-utils' range to ^13.0.6 instead: glob
  # 13 is already in the tree (fastify) and its sync API is a drop-in.
  archiver-utils@5.0.2: patches/archiver-utils@5.0.2.patch
  drizzle-kit@0.31.10: patches/drizzle-kit@0.31.10.patch
